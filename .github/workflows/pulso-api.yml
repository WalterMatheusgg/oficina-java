name: Pulso API

on:
  push:
    branches: [main]
    paths:
      - "design-patterns-bank-api/**"
      - ".github/workflows/pulso-api.yml"
  pull_request:
    paths:
      - "design-patterns-bank-api/**"
      - ".github/workflows/pulso-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulso
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulso -d pulso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/pulso
      DB_USERNAME: pulso
      DB_PASSWORD: pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Pulso API
        working-directory: design-patterns-bank-api
        run: mvn --batch-mode --no-transfer-progress verify
