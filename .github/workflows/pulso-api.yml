name: Pulso API

on:
  push:
    branches: [main]
    paths:
      - "design-patterns-bank-api/**"
      - ".github/workflows/pulso-api.yml"
  pull_request:
    paths:
      - "design-patterns-bank-api/**"
      - ".github/workflows/pulso-api.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Pulso API
        working-directory: design-patterns-bank-api
        run: mvn --batch-mode --no-transfer-progress verify
