services:
  db:
    image: postgres:16-alpine
    container_name: pulso-postgres
    environment:
      POSTGRES_DB: pulso
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
    ports:
      - "5432:5432"
    volumes:
      - pulso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulso-postgres-data:
