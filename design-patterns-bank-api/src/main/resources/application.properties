spring.application.name=pulso-banking-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulso}
spring.datasource.username=${DB_USERNAME:pulso}
spring.datasource.password=${DB_PASSWORD:pulso}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
